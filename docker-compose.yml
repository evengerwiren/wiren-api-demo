services:
  api:
    build:
      context: ./src/Api
      dockerfile: Dockerfile
    container_name: wiren-api
    ports:
      - "8080:8080"
    environment:
      - API_KEY=${API_KEY:-dev-local-key-change-me}
    networks:
      - wiren-network

  client:
    build:
      context: ./src/Client
      dockerfile: Dockerfile
    container_name: wiren-client
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - wiren-network

networks:
  wiren-network:
    driver: bridge
